spring:
  application:
    name: user-service

  flyway:
    enabled: true
    locations: classpath:db/migration
    sql-migration-prefix: v

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    open-in-view: false
